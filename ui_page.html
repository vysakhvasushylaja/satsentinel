<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SatSentinel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#06070A;--p1:#0C0F15;--p2:#11151E;--line:#1C2230;--ink:#E7EAF2;--mute:#8A93A8;--dim:#5A647A;--acc:#5B9BFF;--orange:#FF9A3C;--pink:#FF5C72;--teal:#3DDBB0;--yellow:#FFD24A;--purple:#B388FF;--cyan:#45D4FF;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--bg) radial-gradient(#131927 1px,transparent 1px) 0 0/22px 22px;font:15px/1.55 "IBM Plex Sans",system-ui,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.lab{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.v-replay_attack{--vc:var(--orange)}.v-spoofing_attack{--vc:var(--pink)}.v-eclipse_false_alarm{--vc:var(--teal)}.v-onboard_fault{--vc:var(--yellow)}.v-no_threat{--vc:var(--acc)}.v-unknown{--vc:var(--mute)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:14px 22px}
.brand{display:flex;align-items:baseline;gap:12px;margin-right:8px}
.brand b{font:600 17px var(--mono);letter-spacing:.04em}
.brand span{color:var(--mute);font-size:13px}
.pills{display:flex;gap:2px;padding:4px;background:var(--p1);border:1px solid var(--line);border-radius:12px}
.pills button{padding:7px 14px;border:0;border-radius:9px;background:transparent;color:var(--mute);font:400 13px var(--mono);cursor:pointer}
.pills button[aria-pressed=true]{background:#F2F4F9;color:#0A0C12;font-weight:600}
.search{flex:1 1 260px;max-width:520px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#0E1220;border:1px solid #1E2740;border-radius:12px}
.search input{flex:1;min-width:0;padding:11px 0;border:0;background:transparent;outline:0;font:400 13.5px var(--mono)}
.search kbd{font:400 12px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.shell{flex:1;display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;padding:6px 22px 18px;align-items:start}
.panel{background:var(--p1);border:1px solid var(--line);border-radius:14px}
.list{position:sticky;top:12px;max-height:calc(100vh - 140px);display:flex;flex-direction:column}
.list .lab{padding:14px 16px 6px}
#alerts{overflow:auto;padding:4px 8px 10px}
.alert{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 10px;border:1px solid transparent;border-radius:10px;background:transparent;cursor:pointer}
.alert:hover{background:var(--p2)}
.alert.sel{background:var(--p2);border-color:#2A3550}
.alert .at{display:flex;flex-direction:column;min-width:0}
.alert strong{font:600 13px var(--mono)}
.alert small{color:var(--dim);font:400 11.5px var(--mono)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:#1A2030;border:1px solid #2A3347}
.dot[class*=" v-"]{background:var(--vc);border-color:var(--vc);box-shadow:0 0 10px var(--vc)}
.empty,.err{padding:16px;color:var(--mute)}.err{color:var(--pink)}
.caseview{display:flex;flex-direction:column;gap:16px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:16px 20px}
.head h1{margin:0;font:600 18px var(--mono);letter-spacing:.04em}
.head .sub{color:var(--mute);font:400 12.5px var(--mono)}
.stamp{margin-left:auto;display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border:1px solid var(--vc);border-radius:999px;color:var(--vc);font:600 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 0 18px color-mix(in srgb,var(--vc) 35%,transparent)}
.meter{display:inline-flex;gap:3px}.meter span{width:16px;height:6px;border-radius:2px;background:#232B3E}.meter span.on{background:var(--vc);box-shadow:0 0 8px var(--vc)}
.field{padding:6px 10px 0;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#0F1420 0%,var(--p1) 70%)}
.field svg{display:block;width:100%;height:auto}
.fnode{cursor:pointer;opacity:0;animation:fin .55s ease-out forwards}
.fnode:focus-visible{outline:none}.fnode:focus-visible circle.hit{stroke:var(--acc);stroke-width:2}
@keyframes fin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fnode{animation:none;opacity:1}.ev.flash{animation:none}}
.fcap{padding:0 20px 14px;color:var(--dim);font:400 12px var(--mono)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.body{padding:6px 22px 22px;min-width:0}
.sec{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.sec:first-child{margin-top:12px;border-top:0;padding-top:4px}
.sec h2{margin:0 0 4px;font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.hint{margin:0 0 10px;color:var(--mute);font-size:13.5px;max-width:72ch}
.reason{margin:0;color:var(--ink);max-width:72ch}
.note{margin:12px 0 0;padding:10px 12px;border-left:2px solid var(--yellow);background:var(--p2);border-radius:0 10px 10px 0;max-width:72ch}
.ev{border:1px solid var(--line);background:var(--p2);border-radius:12px;padding:11px 14px;margin:9px 0}
.ev.flash{animation:flash 1.4s ease-out}
@keyframes flash{from{border-color:var(--acc);box-shadow:0 0 22px rgba(91,155,255,.45)}to{border-color:var(--line);box-shadow:none}}
.evh{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.tag{padding:2px 8px;border-radius:6px;background:var(--acc);color:#07101F;font:600 12px var(--mono)}
.who{color:var(--mute);font:400 12.5px var(--mono)}
.chip{padding:1px 9px;border-radius:999px;border:1px solid var(--yellow);color:var(--yellow);font:600 11px var(--mono)}
.evt{margin:7px 0 2px;max-width:82ch;overflow-wrap:anywhere}
details.sql{margin-top:7px}details.sql summary{cursor:pointer;color:var(--acc);font:400 12.5px var(--mono)}
details.sql pre{margin:8px 0 2px;padding:11px 13px;background:#080A10;border:1px solid var(--line);border-radius:10px;overflow:auto;color:#B8C2DA;font:12.5px/1.55 var(--mono)}
.li{margin:7px 0;padding:9px 13px;background:var(--p2);border-radius:10px;max-width:82ch}
.li.mem{border-left:2px solid var(--purple)}
.cite{padding:0 6px;margin:0 1px;border:1px solid var(--acc);border-radius:6px;background:transparent;color:var(--acc);font:600 12px var(--mono);cursor:pointer}
.xtext{margin:12px 0 4px;max-width:76ch}.xmeta{margin:0;color:var(--dim);font:400 12px var(--mono)}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:#07101F;font:600 13px var(--mono);cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc)}.btn.rej{background:transparent;color:var(--pink);border-color:var(--pink)}
.btn.link{background:transparent;border-color:transparent;color:var(--mute);font-weight:400}
.btn:disabled{opacity:.55;cursor:progress}
.rail{position:sticky;top:12px;padding:18px}
.rail h2{margin:0 0 6px;font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.rail .lab{display:block;margin:16px 0 6px}
.rail .rec{margin:0;padding:10px 12px;background:var(--p2);border-radius:10px}
.rail input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#080A10;font:400 13px var(--mono)}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.msg{margin:12px 0 0;color:var(--teal);font:400 12.5px var(--mono);min-height:1.4em}.msg.bad{color:var(--pink)}
.foot{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:space-between;margin:0 22px 18px;padding:12px 18px;background:var(--p1);border:1px solid var(--line);border-radius:14px;color:var(--mute);font:400 12px var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:var(--vc);box-shadow:0 0 8px var(--vc)}
@media (max-width:1180px){.cols{grid-template-columns:minmax(0,1fr)}.rail{position:static}}
@media (max-width:820px){.shell{grid-template-columns:1fr;padding:6px 14px 14px}.list{position:static;max-height:none}.top{padding:12px 14px}.foot{margin:0 14px 14px}.stamp{margin-left:0}}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><b>SatSentinel</b><span>Explainable satellite alert investigation</span></div>
 <div class="pills" role="group" aria-label="Alert source">
  <button type="button" data-f="all" aria-pressed="true">All</button>
  <button type="button" data-f="synthetic" aria-pressed="false">Synthetic</button>
  <button type="button" data-f="real" aria-pressed="false">Real data</button>
 </div>
 <label class="search"><span class="lab">Find</span><input id="q" type="search" placeholder="alert id or satellite" autocomplete="off"><kbd>/</kbd></label>
</header>
<div class="shell">
 <nav class="panel list" aria-label="Alerts"><div class="lab">Alerts</div><div id="alerts"><p class="empty">Loading alerts...</p></div></nav>
 <main id="case"><p class="empty panel">Select an alert to start an investigation.</p></main>
</div>
<footer class="foot">
 <div class="legend">
  <span class="v-replay_attack"><i></i>replay attack</span><span class="v-spoofing_attack"><i></i>spoofing attack</span><span class="v-eclipse_false_alarm"><i></i>eclipse false alarm</span><span class="v-onboard_fault"><i></i>onboard fault</span><span class="v-no_threat"><i></i>no threat</span><span class="v-unknown"><i></i>unknown</span>
 </div>
 <div id="count">0 alerts</div>
</footer>
<script>
var LABEL={replay_attack:'Replay attack',spoofing_attack:'Spoofing attack',eclipse_false_alarm:'Eclipse false alarm',onboard_fault:'Onboard fault',no_threat:'No threat',unknown:'Unknown'};
var VCOL={replay_attack:'#FF9A3C',spoofing_attack:'#FF5C72',eclipse_false_alarm:'#3DDBB0',onboard_fault:'#FFD24A',no_threat:'#5B9BFF',unknown:'#8A93A8'};
var CHECKS=[{k:'R',tool:'replay_check',label:'REPLAY CHECK',col:'#FF9A3C'},{k:'H',tool:'hmac_check',label:'HMAC CHECK',col:'#FF5C72'},{k:'F',tool:'rf_check',label:'RF CHECK · SIM',col:'#FFD24A'},{k:'V',tool:'value_check',label:'VALUE CHECK',col:'#FFD24A'},{k:'E',tool:'eclipse_check',label:'ECLIPSE CHECK',col:'#3DDBB0'}];
function nice(v){return LABEL[v]||String(v).replace(/_/g,' ')}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined&&x!==null)e.textContent=x;return e}
async function api(p,o){var r=await fetch(p,o);var j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
function asText(o){return o.summary||o.text||JSON.stringify(o)}
var rows=[],filter='all',query='',current=null,verdicts={};
function isReal(id){return parseInt(String(id).slice(2),10)>=100}
function drawAlerts(){var box=document.getElementById('alerts');box.replaceChildren();
 var shown=rows.filter(function(a){var okf=filter==='all'||(filter==='real')===isReal(a.alert_id);
  var hay=(a.alert_id+' '+a.sat_id).toLowerCase();return okf&&(!query||hay.indexOf(query)>=0)});
 document.getElementById('count').textContent=rows.length+' alerts · '+Object.keys(verdicts).length+' investigated this session';
 if(!shown.length){box.append(el('p','empty','No alerts match.'));return}
 shown.forEach(function(a){var b=el('button','alert');b.type='button';b.id='row-'+a.alert_id;
  if(a.alert_id===current)b.classList.add('sel');
  var dot=el('span','dot');dot.id='bd-'+a.alert_id;
  if(verdicts[a.alert_id]){dot.className='dot v-'+verdicts[a.alert_id];dot.title=nice(verdicts[a.alert_id])}
  var t=el('span','at');t.append(el('strong',null,a.alert_id),el('small',null,a.sat_id+' · '+String(a.ts).slice(0,16).replace('T',' ')));
  b.append(dot,t);b.onclick=function(){openCase(a.alert_id,false)};box.append(b)})}
async function loadAlerts(){try{rows=await api('/api/alerts');drawAlerts()}
 catch(e){document.getElementById('alerts').replaceChildren(el('p','err','Could not load alerts: '+e.message))}}
document.querySelectorAll('.pills button').forEach(function(b){b.onclick=function(){filter=b.getAttribute('data-f');
 document.querySelectorAll('.pills button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});drawAlerts()}});
var qi=document.getElementById('q');qi.oninput=function(){query=qi.value.trim().toLowerCase();drawAlerts()};
document.addEventListener('keydown',function(e){if(e.key==='/'&&document.activeElement!==qi&&document.activeElement.tagName!=='INPUT'){e.preventDefault();qi.focus()}});
function focusEl(id,flash){var t=document.getElementById(id);if(!t)return;t.scrollIntoView({block:'center',behavior:'smooth'});
 if(flash){t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}}
function cited(parent,text){String(text).split(/(\[E\d+\])/).forEach(function(p){var m=/^\[E(\d+)\]$/.exec(p);
 if(m){var b=el('button','cite',p);b.type='button';b.title='Show evidence '+p;b.onclick=function(){focusEl('ev-'+m[1],true)};parent.append(b)}
 else if(p){parent.append(document.createTextNode(p))}})}
function sec(parent,id,title,hint){var s=el('section','sec');s.id=id;s.append(el('h2',null,title));if(hint)s.append(el('p','hint',hint));parent.append(s);return s}
function li(parent,text,cls,head){var d=el('div','li'+(cls?' '+cls:''));if(head){d.append(el('strong',null,head+' '))}cited(d,text);parent.append(d)}
var NS='http://www.w3.org/2000/svg';
function sv(tag,attrs){var e=document.createElementNS(NS,tag);for(var k in attrs){e.setAttribute(k,attrs[k])}return e}
function buildField(c){
 var W=1000,H=380,cx=500,cy=188,rx=360,ry=132;
 var svg=sv('svg',{viewBox:'0 0 '+W+' '+H,role:'group','aria-label':'Evidence field for '+c.alert_id});
 var defs=sv('defs',{});var f=sv('filter',{id:'glow',x:'-80%',y:'-80%',width:'260%',height:'260%'});
 f.append(sv('feGaussianBlur',{stdDeviation:'5',result:'b'}));var mg=sv('feMerge',{});mg.append(sv('feMergeNode',{in:'b'}),sv('feMergeNode',{in:'SourceGraphic'}));f.append(mg);defs.append(f);svg.append(defs);
 var vc=VCOL[c.verdict]||'#8A93A8';
 svg.append(sv('circle',{cx:cx,cy:cy,r:86,fill:'none',stroke:'#1C2230','stroke-dasharray':'3 6'}));
 svg.append(sv('circle',{cx:cx,cy:cy,r:56,fill:'none',stroke:'#1C2230'}));
 var nodes=[];var flags=c.flags||{};
 CHECKS.forEach(function(ch){if(ch.k in flags){var idx=-1;(c.evidence||[]).forEach(function(e,i){if(e.tool===ch.tool)idx=i+1});
  nodes.push({key:ch.k,label:ch.label,col:ch.col,lit:!!flags[ch.k],sub:flags[ch.k]?'FOUND':'NOT FOUND',target:idx>0?'ev-'+idx:'sec-evidence',flash:idx>0})}});
 var nc=(c.critique||[]).length,hasMem=Array.isArray(c.memory)&&c.memory.length>0,hasHist=(c.decision_history||[]).length>0;
 nodes.push({key:'crit',label:'SELF-CRITIQUE',col:'#5B9BFF',lit:nc>0,sub:nc+(nc===1?' ITEM':' ITEMS'),target:'sec-critique'});
 nodes.push({key:'mem',label:'ANALYST MEMORY',col:'#B388FF',lit:hasMem||hasHist,sub:hasMem?'NOTE MATCHES':(hasHist?'DECISIONS':'NONE'),target:'sec-memory'});
 nodes.push({key:'llm',label:'NEMOTRON',col:'#45D4FF',lit:false,sub:'ON REQUEST',target:'sec-explain'});
 var map={};
 nodes.forEach(function(n,i){var a=-Math.PI/2+(2*Math.PI*i/nodes.length);n.x=cx+rx*Math.cos(a);n.y=cy+ry*Math.sin(a);
  n.line=sv('line',{x1:cx,y1:cy,x2:n.x,y2:n.y,stroke:n.lit?n.col:'#1C2230','stroke-width':n.lit?1.5:1,opacity:n.lit?.65:.9});svg.append(n.line)});
 var core=sv('g',{});core.append(sv('circle',{cx:cx,cy:cy,r:30,fill:vc,filter:'url(#glow)'}),sv('circle',{cx:cx,cy:cy,r:12,fill:'#06070A',opacity:.35}));svg.append(core);
 var ct=sv('text',{x:cx,y:cy+78,'text-anchor':'middle',fill:vc,'font-family':'JetBrains Mono,monospace','font-size':13,'font-weight':600,'letter-spacing':'0.08em'});ct.textContent=nice(c.verdict).toUpperCase();svg.append(ct);
 nodes.forEach(function(n,i){var g=sv('g',{class:'fnode',tabindex:0,role:'button','aria-label':n.label+': '+n.sub.toLowerCase()});g.style.animationDelay=(i*90)+'ms';
  var hit=sv('circle',{class:'hit',cx:n.x,cy:n.y,r:18,fill:'transparent'});
  var dotc=sv('circle',{cx:n.x,cy:n.y,r:10,stroke:n.lit?n.col:'#2A3347','stroke-width':2,fill:n.lit?n.col:'#0C0F15'});if(n.lit)dotc.setAttribute('filter','url(#glow)');
  var left=n.x<cx-30,right=n.x>cx+30;var ax=left?'end':(right?'start':'middle');var lx=left?n.x-20:(right?n.x+20:n.x);var ly=right||left?n.y-2:(n.y<cy?n.y-32:n.y+30);
  var t1=sv('text',{x:lx,y:ly,'text-anchor':ax,fill:n.lit?'#E7EAF2':'#5A647A','font-family':'JetBrains Mono,monospace','font-size':12,'font-weight':600,'letter-spacing':'0.08em'});t1.textContent=n.label;
  var t2=sv('text',{x:lx,y:ly+16,'text-anchor':ax,fill:n.lit?n.col:'#3F485C','font-family':'JetBrains Mono,monospace','font-size':11,'letter-spacing':'0.06em'});t2.textContent=n.sub;
  g.append(hit,dotc,t1,t2);
  var go=function(){focusEl(n.target,n.flash)};g.onclick=go;g.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}};
  n.dot=dotc;n.t1=t1;n.t2=t2;map[n.key]=n;svg.append(g)});
 return {svg:svg,light:function(key,text){var n=map[key];if(!n)return;n.dot.setAttribute('fill',n.col);n.dot.setAttribute('stroke',n.col);n.dot.setAttribute('filter','url(#glow)');
  n.t1.setAttribute('fill','#E7EAF2');n.t2.setAttribute('fill',n.col);n.t2.textContent=text;n.line.setAttribute('stroke',n.col);n.line.setAttribute('stroke-width',1.5);n.line.setAttribute('opacity',.65)}}}
async function openCase(id,refresh){current=id;drawAlerts();
 var box=document.getElementById('case');box.className='';box.replaceChildren(el('p','empty panel','Investigating '+id+'...'));
 try{var c=await api('/api/case/'+id+(refresh?'?refresh=1':''));verdicts[id]=c.verdict;drawAlerts();render(box,c)}
 catch(e){box.replaceChildren(el('p','err panel','Could not open '+id+': '+e.message))}}
function render(box,c){box.replaceChildren();box.className='caseview v-'+c.verdict;
 var head=el('div','panel head');var tt=el('div');tt.append(el('h1',null,'CASE '+c.alert_id),el('div','sub',c.sat_id+' · '+c.ts));head.append(tt);
 var lv={low:1,medium:2,high:3}[c.confidence]||0;var meter=el('span','meter');meter.setAttribute('aria-hidden','true');for(var i=1;i<=3;i++){meter.append(el('span',i<=lv?'on':''))}
 var stamp=el('span','stamp');stamp.append(meter,el('span',null,nice(c.verdict)+' · '+c.confidence));head.append(stamp);box.append(head);
 var field=el('div','panel field');var fld=buildField(c);field.append(fld.svg);field.append(el('p','fcap','Lit nodes fired or have content. Dim nodes found nothing. Click a node to jump to its details.'));box.append(field);
 var cols=el('div','cols');var art=el('article','panel body');
 var s0=sec(art,'sec-why','Why this verdict');s0.append(el('p','reason',c.confidence_reason));if(c.data_note){s0.append(el('p','note',c.data_note))}
 var es=sec(art,'sec-evidence','Evidence','Each item shows what was checked. Open the SQL to see exactly what ran.');
 (c.evidence||[]).forEach(function(e,i){var n=i+1;var d=el('div','ev');d.id='ev-'+n;
  var h=el('div','evh');h.append(el('span','tag','E'+n),el('span','who',[e.agent,e.tool||e.name].filter(Boolean).join(' / ')));
  var sm=String(asText(e));if(/SIMULATED/i.test(sm)){h.append(el('span','chip','SIMULATED'))}
  d.append(h,el('p','evt',sm));
  if(e.sql){var dt=el('details','sql');dt.append(el('summary',null,'Show the SQL that produced this'),el('pre',null,e.sql));d.append(dt)}
  es.append(d)});
 var ns=sec(art,'sec-notfound','What was not found');
 if(!(c.not_found||[]).length)ns.append(el('p','hint','Nothing missing.'));
 (c.not_found||[]).forEach(function(n){li(ns,typeof n==='string'?n:asText(n))});
 var ks=sec(art,'sec-critique','Self-critique','The agent challenges its own first answer.');
 if(!(c.critique||[]).length)ks.append(el('p','hint','No critique items.'));
 (c.critique||[]).forEach(function(k){li(ks,asText(k),null,(k.status?'['+k.status+'] ':'')+(k.name||k.check||''))});
 if(c.counterfactuals&&c.counterfactuals.length){var cs=sec(art,'sec-cf','What would change this verdict','Computed by the rules, not by the language model.');
  c.counterfactuals.forEach(function(t){li(cs,t)})}
 var xs=sec(art,'sec-explain','Plain-language explanation','Written by Nemotron through Meterless Nightshift. It explains the evidence above and cannot change the verdict.');
 var xb=el('button','btn ghost','Explain with Nemotron');xb.type='button';var xt=el('p','xtext');var xi=el('p','xmeta');
 xb.onclick=async function(){xb.disabled=true;xt.textContent='Asking Nemotron via Nightshift...';xi.textContent='';
  try{var x=await api('/api/explain/'+c.alert_id);xt.replaceChildren();cited(xt,x.text);
   if(x.source==='llm'){xi.textContent='Model '+x.model+' · receipt '+x.receipt_id+' · '+x.latency_ms+' ms';fld.light('llm','ANSWERED')}
   else{xi.textContent='Template fallback ('+(x.reason||'model unavailable')+')'}}
  catch(e){xt.textContent='Could not get an explanation: '+e.message}xb.disabled=false};
 xs.append(xb,xt,xi);
 var ms=sec(art,'sec-memory','Analyst memory','Prior knowledge from an analyst, not an observation.');
 if(c.memory==='unavailable')ms.append(el('p','hint','Memory unavailable. The decision was made from data only.'));
 else if(!c.memory||!c.memory.length)ms.append(el('p','hint','No matching analyst note.'));
 else c.memory.forEach(function(m){li(ms,m.text,'mem',m.id)});
 if(c.decision_history&&c.decision_history.length){ms.append(el('p','hint','Earlier decisions for this satellite and verdict. Shown only: they never change the verdict or the confidence.'));
  c.decision_history.forEach(function(m){li(ms,m.text,'mem',m.id+' · '+m.decision)})}
 var rail=el('aside','panel rail');rail.append(el('h2',null,'Your decision'),el('p','hint','Recommendation only. Human approval required.'));
 rail.append(el('span','lab','Recommended action'),el('p','rec',c.recommended_action));
 var lab=el('label','lab','Note (optional)');lab.setAttribute('for','dnote');var note=el('input');note.id='dnote';note.placeholder='Why you decided this';
 var msg=el('p','msg');msg.setAttribute('role','status');
 function send(d){return async function(){try{var r=await api('/api/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({alert_id:c.alert_id,decision:d,note:note.value})});msg.className='msg';msg.textContent='Recorded: '+r.decision+' at '+r.time_utc}catch(e){msg.className='msg bad';msg.textContent='Could not record: '+e.message}}}
 var a=el('button','btn','Approve');a.type='button';a.onclick=send('approve');
 var r=el('button','btn rej','Reject');r.type='button';r.onclick=send('reject');
 var rr=el('button','btn link','Re-run investigation');rr.type='button';rr.onclick=function(){openCase(c.alert_id,true)};
 var acts=el('div','acts');acts.append(a,r,rr);
 rail.append(lab,note,acts,msg);cols.append(art,rail);box.append(cols)}
loadAlerts();
</script>
